name: Sonar
on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main]

jobs:
  sonarcloud:
    permissions:
      contents: read
      issues: read
      pull-requests: read

    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 12

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and coverage
        run: pnpm --filter @vuepic/vue-datepicker test:coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
